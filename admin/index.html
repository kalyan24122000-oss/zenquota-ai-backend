<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenQuota AI — Admin Login</title>
  <meta name="description" content="Admin panel login for ZenQuota AI management dashboard">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">
          <h1>🧠 ZenQuota AI</h1>
          <p>Admin Dashboard</p>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter admin username" required autofocus>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter password" required>
          </div>

          <div class="error-msg" id="errorMsg"></div>

          <button type="submit" class="btn btn-primary" id="loginBtn">
            Sign In to Dashboard
          </button>
        </form>

        <p style="text-align:center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
          Default: admin / admin123
        </p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
